name: VeloPass CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile & syntax check Python modules
        run: |
          python -m compileall -q backend run.py manage.py tests

      - name: Verify database migrations cleanly initialize
        env:
          APP_ENV: testing
          DATABASE_PATH: data/ci_check.db
          SECRET_KEY: ci-ephemeral-non-secret-validation-key-0001
          QR_HMAC_SECRET: ci-ephemeral-non-secret-qr-hmac-key-0002
        run: |
          python manage.py migrate
          python manage.py check-health

      - name: Run automated test suite (30+ test cases & concurrency checks)
        env:
          APP_ENV: testing
        run: |
          pytest -v
