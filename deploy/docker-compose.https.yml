services:
  velopass-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: velopass-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - velopass_data:/app/data
    expose:
      - "5000"

  caddy-https:
    image: caddy:2-alpine
    container_name: velopass-caddy
    restart: unless-stopped
    environment:
      VELOPASS_DOMAIN: ${VELOPASS_DOMAIN:-velopass.yourdomain.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - velopass-app

volumes:
  velopass_data:
  caddy_data:
  caddy_config:
